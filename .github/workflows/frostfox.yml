name: FrostFox CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Optional upstream renderer library. Not fatal if it is missing.
      - name: Get LTW (optional)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK
        run: gradle :app_mojo:assembleFullDebug --stacktrace

      - name: Report APK size
        run: |
          APK=$(ls app_mojo/build/outputs/apk/full/debug/*.apk | head -1)
          mkdir -p out
          cp "$APK" out/frostfox-baseline-debug.apk
          {
            echo "### Baseline APK size"
            echo "Total file size: $(du -h "$APK" | cut -f1)"
            echo
            echo "Uncompressed totals per folder:"
            for p in "lib/arm64-v8a" "lib/armeabi-v7a" "lib/x86" "lib/x86_64" "assets" "res" "classes"; do
              echo "- $p: $(unzip -l "$APK" "$p*" 2>/dev/null | tail -1 | awk '{print $1}') bytes"
            done
            echo
            echo "15 largest entries (bytes, name):"
            echo '```'
            unzip -l "$APK" | awk 'NR>3 && NF>=4 {print $1, $4}' | sort -n -r | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frostfox-baseline-debug
          path: out/frostfox-baseline-debug.apk
