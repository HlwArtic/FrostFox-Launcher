name: FrostFox CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      # FrostFox strip steps 1 and 2. Fails loudly if an anchor is not found.
      #  step 1: arm64 only, no Vulkan shader libraries, no other-CPU JRE packages
      #  step 2: no LTW renderer (step does not download it), English-only resources
      - name: Apply FrostFox strip steps
        run: |
          rm -f app_mojo/libs/shaderc.aar app_mojo/libs/spvc.aar
          python3 - <<'PYEOF'
          p = 'app_mojo/build.gradle'
          s = open(p).read()
          needle = "        minSdkVersion 21\n"
          assert s.count(needle) == 1, "minSdkVersion anchor not found"
          s = s.replace(needle, needle + "        ndk { abiFilters 'arm64-v8a' }\n        resConfigs 'en'\n")
          s += """

          // FrostFox step 1: other-CPU JRE packages are not needed in an arm64-only APK
          tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { t ->
              t.doLast {
                  try {
                      def out = t.outputDir.get().asFile
                      ['bin-arm.tar.xz', 'bin-x86.tar.xz', 'bin-x86_64.tar.xz'].each {
                          def f = new File(out, 'components/jre/' + it)
                          if (f.exists()) { f.delete(); println 'FrostFox: removed ' + f.name }
                      }
                  } catch (Throwable e) {
                      println 'FrostFox: asset cleanup skipped: ' + e
                  }
              }
          }
          """
          open(p, 'w').write(s)
          print("strip steps applied")
          PYEOF

      - name: Build debug APK
        run: gradle :app_mojo:assembleFullDebug --stacktrace

      # R8-shrunk build (closest to a release build). Optional: failure here does not fail the run.
      - name: Build shrunk (R8) APK
        id: shrunk
        continue-on-error: true
        run: gradle :app_mojo:assembleFullProguardNoDebug --stacktrace

      - name: Report APK sizes
        run: |
          mkdir -p out
          report() {
            local APK="$1" TITLE="$2"
            echo "### $TITLE"
            echo "Total file size: $(du -h "$APK" | cut -f1)"
            echo
            for p in "lib/arm64-v8a" "assets" "res" "classes"; do
              echo "- $p: $(unzip -l "$APK" "$p*" 2>/dev/null | tail -1 | awk '{print $1}') bytes"
            done
            echo
            echo "10 largest entries (bytes, name):"
            echo '```'
            unzip -l "$APK" | awk 'NR>3 && NF>=4 {print $1, $4}' | sort -n -r | head -10
            echo '```'
          }
          DEBUG=$(ls app_mojo/build/outputs/apk/full/debug/*.apk | head -1)
          cp "$DEBUG" out/frostfox-step2-debug.apk
          { report "$DEBUG" "Step 2 debug APK (step 1 was 27M, original 71M)"; } >> "$GITHUB_STEP_SUMMARY"
          SHRUNK=$(ls app_mojo/build/outputs/apk/full/proguardNoDebug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$SHRUNK" ]; then
            cp "$SHRUNK" out/frostfox-step2-shrunk.apk
            { report "$SHRUNK" "Step 2 shrunk (R8) APK"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Shrunk (R8) APK was not built (see the build step log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: frostfox-step2
          path: out/*.apk

