name: FrostFox CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      # Build-file strip steps: arm64 only, no Vulkan shader libraries,
      # no LTW renderer, English-only resources, no other-CPU JRE packages.
      - name: Apply FrostFox build strip steps
        run: |
          rm -f app_mojo/libs/shaderc.aar app_mojo/libs/spvc.aar
          python3 - <<'PYEOF'
          p = 'app_mojo/build.gradle'
          s = open(p).read()
          needle = "        minSdkVersion 21\n"
          assert s.count(needle) == 1, "minSdkVersion anchor not found"
          s = s.replace(needle, needle + "        ndk { abiFilters 'arm64-v8a' }\n        resConfigs 'en'\n")
          s += """

          // FrostFox: other-CPU JRE packages are not needed in an arm64-only APK
          tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { t ->
              t.doLast {
                  try {
                      def out = t.outputDir.get().asFile
                      ['bin-arm.tar.xz', 'bin-x86.tar.xz', 'bin-x86_64.tar.xz'].each {
                          def f = new File(out, 'components/jre/' + it)
                          if (f.exists()) { f.delete(); println 'FrostFox: removed ' + f.name }
                      }
                  } catch (Throwable e) {
                      println 'FrostFox: asset cleanup skipped: ' + e
                  }
              }
          }
          """
          open(p, 'w').write(s)
          print("build strip steps applied")
          PYEOF

      # Source patches live in the repo's patches/ folder and are applied in name order.
      # Fails loudly if a patch no longer applies.
      - name: Apply FrostFox source patches
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done

      - name: Build debug APK
        run: gradle :app_mojo:assembleFullDebug --stacktrace

      - name: Report APK size
        run: |
          APK=$(ls app_mojo/build/outputs/apk/full/debug/*.apk | head -1)
          mkdir -p out
          cp "$APK" out/frostfox-debug.apk
          {
            echo "### FrostFox debug APK"
            echo "Total file size: $(du -h "$APK" | cut -f1)"
            echo
            for p in "lib/arm64-v8a" "assets" "res" "classes"; do
              echo "- $p: $(unzip -l "$APK" "$p*" 2>/dev/null | tail -1 | awk '{print $1}') bytes"
            done
            echo
            echo "Patches applied:"
            echo '```'
            ls patches 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frostfox-debug
          path: out/frostfox-debug.apk
