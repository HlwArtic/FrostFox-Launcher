name: FrostFox CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Optional upstream renderer library. Not fatal if it is missing.
      - name: Get LTW (optional)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      # FrostFox strip step 1: arm64 only, no Vulkan shader libraries.
      # Fails loudly if an anchor is not found, so nothing is silently skipped.
      - name: Apply FrostFox strip step 1
        run: |
          rm -f app_mojo/libs/shaderc.aar app_mojo/libs/spvc.aar
          python3 - <<'PYEOF'
          p = 'app_mojo/build.gradle'
          s = open(p).read()
          needle = "        minSdkVersion 21\n"
          assert s.count(needle) == 1, "minSdkVersion anchor not found"
          s = s.replace(needle, needle + "        ndk { abiFilters 'arm64-v8a' }\n")
          s += """

          // FrostFox step 1: other-CPU JRE packages are not needed in an arm64-only APK
          tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { t ->
              t.doLast {
                  try {
                      def out = t.outputDir.get().asFile
                      ['bin-arm.tar.xz', 'bin-x86.tar.xz', 'bin-x86_64.tar.xz'].each {
                          def f = new File(out, 'components/jre/' + it)
                          if (f.exists()) { f.delete(); println 'FrostFox: removed ' + f.name }
                      }
                  } catch (Throwable e) {
                      println 'FrostFox: asset cleanup skipped: ' + e
                  }
              }
          }
          """
          open(p, 'w').write(s)
          print("step 1 applied")
          PYEOF

      - name: Build debug APK
        run: gradle :app_mojo:assembleFullDebug --stacktrace

      - name: Report APK size
        run: |
          APK=$(ls app_mojo/build/outputs/apk/full/debug/*.apk | head -1)
          mkdir -p out
          cp "$APK" out/frostfox-step1-debug.apk
          {
            echo "### Step 1 APK size (baseline was 71M)"
            echo "Total file size: $(du -h "$APK" | cut -f1)"
            echo
            echo "Uncompressed totals per folder:"
            for p in "lib/arm64-v8a" "lib/armeabi-v7a" "lib/x86" "lib/x86_64" "assets" "res" "classes"; do
              echo "- $p: $(unzip -l "$APK" "$p*" 2>/dev/null | tail -1 | awk '{print $1}') bytes"
            done
            echo
            echo "15 largest entries (bytes, name):"
            echo '```'
            unzip -l "$APK" | awk 'NR>3 && NF>=4 {print $1, $4}' | sort -n -r | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frostfox-step1-debug
          path: out/frostfox-step1-debug.apk
